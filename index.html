<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ДУША — Студия</title>
  <meta name="description" content="Студия ДУША — татуировка и массаж. Дмитрий Вселенский.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:      #171717;
      --surface: #1f1f1f;
      --border:  #2e2e2e;
      --text:    #f0f0f0;
      --muted:   #888;
      --accent:  #c8a050;
      --accent-h:#d4ae64;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.4rem, 10vw, 4.5rem);
      font-weight: 700;
      letter-spacing: 0.3em;
      color: var(--accent);
      margin-bottom: 0.2em;
      text-align: center;
    }

    .tagline {
      font-size: clamp(0.65rem, 2vw, 0.85rem);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: clamp(2.5rem, 7vh, 4.5rem);
      text-align: center;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: min(320px, 90vw);
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.35rem 1.75rem;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      text-decoration: none;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.6rem;
      letter-spacing: 0.15em;
      border-radius: 3px;
      transition: border-color 0.25s, background 0.25s, color 0.25s;
    }

    .btn:hover {
      border-color: var(--accent);
      background: rgba(200, 160, 80, 0.08);
      color: var(--accent);
    }

    .btn .arrow {
      font-size: 1rem;
      opacity: 0.4;
      transition: opacity 0.25s, transform 0.25s;
    }

    .btn:hover .arrow {
      opacity: 1;
      transform: translateX(5px);
    }

    .sep {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .sep-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .sep-dot {
      font-size: 0.6rem;
      color: var(--border);
    }

    footer {
      position: fixed;
      bottom: 1.5rem;
      font-size: 0.68rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(136,136,136,0.4);
    }
  </style>
</head>
<body>

  <p class="logo">ДУША</p>
  <p class="tagline">Дмитрий Вселенский · Студия</p>

  <div class="buttons">
    <a href="tatu/" class="btn">
      Татуировка
      <span class="arrow">→</span>
    </a>

    <div class="sep">
      <span class="sep-line"></span>
      <span class="sep-dot">·</span>
      <span class="sep-line"></span>
    </div>

    <a href="massage/" class="btn">
      Массаж
      <span class="arrow">→</span>
    </a>
  </div>

  <footer>душа-студия.рф</footer>

</body>
</html>
